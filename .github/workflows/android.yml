name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show build errors (only if the build failed)
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed" -A3 build.log | head -100 > errors.txt || true
          echo "=========== BUILD ERRORS ==========="
          cat errors.txt
          {
            echo "### Build errors"
            echo '```'
            cat errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log (only if the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyDots-debug-apk
          path: app/build/outputs/apk/debug/*.apk
